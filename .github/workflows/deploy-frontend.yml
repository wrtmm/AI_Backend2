name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "scripts/deploy/deploy-frontend.ps1"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  # 프론트엔드 Windows 서버 경로
  HTML_DIR: 'C:\nginx-1.30.5\html'
  STAGING_DIR: 'C:\Users\test\deploy\frontend'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload built files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_FRONTEND_HOST }}
          port: ${{ secrets.DEPLOY_FRONTEND_PORT }}
          username: ${{ secrets.DEPLOY_FRONTEND_USER }}
          password: ${{ secrets.DEPLOY_FRONTEND_PASSWORD }}
          source: "frontend/dist/**,scripts/deploy/deploy-frontend.ps1"
          target: ${{ env.STAGING_DIR }}

      - name: Publish to Nginx html folder
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_FRONTEND_HOST }}
          port: ${{ secrets.DEPLOY_FRONTEND_PORT }}
          username: ${{ secrets.DEPLOY_FRONTEND_USER }}
          password: ${{ secrets.DEPLOY_FRONTEND_PASSWORD }}
          script: powershell -NoProfile -ExecutionPolicy Bypass -File "${{ env.STAGING_DIR }}\scripts\deploy\deploy-frontend.ps1" -StagingDir "${{ env.STAGING_DIR }}\frontend\dist" -HtmlDir "${{ env.HTML_DIR }}"
